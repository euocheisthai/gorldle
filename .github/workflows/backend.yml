name: dotadle backend release

on:
  push:
    branches: ['**']
    paths: ['back/**']

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/publish-image.yml
    with:
      dockerfile: back/Dockerfile
      image: euocheisthai/gorldle-api
    secrets:
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
