name: publish image

on:
  workflow_call:
    inputs:
      dockerfile:
        type: string
        required: true
      image:
        type: string
        required: true
      bundle:
        type: string
        required: false
    secrets:
      dockerhub_token:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: lab-runners
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.bundle != ''
        with:
          name: ${{ inputs.bundle }}
          path: front/dist/
      - name: tag w current revision
        id: revision
        shell: bash
        run: echo "tag=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: euocheisthai
          password: ${{ secrets.dockerhub_token }}
      - name: build and push
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.image }}:${{ steps.revision.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: record published image
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ steps.revision.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'Published `%s:%s` (digest `%s`).\n' "$IMAGE" "$TAG" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
